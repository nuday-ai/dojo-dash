[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dojo-dash"
dynamic = ["version"]
description = "A config-as-code reporting dashboard and SOC 2 / CASA evidence view for DefectDojo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "nuday-ai" }]
keywords = ["defectdojo", "security", "dashboard", "reporting", "soc2", "vulnerability-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6",
    # zoneinfo (stdlib) needs the IANA tz database, which slim/Alpine base images omit;
    # the tzdata wheel provides it so quiet-hours gating works everywhere.
    "tzdata",
]

# The MongoDB dedup backend is optional — memory/file backends need no extra deps.
[project.optional-dependencies]
mongodb = ["pymongo>=4"]

# Test tooling. A PEP 735 group rather than an extra: it's for developing dojo-dash,
# never for installing it, so it stays out of the published wheel's metadata while
# still being pinned by uv.lock. `uv run pytest` picks it up with no extra flags.
[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/nuday-ai/dojo-dash"
Source = "https://github.com/nuday-ai/dojo-dash"

[project.scripts]
dojo-dash = "dojo_dash.cli:main"

[tool.setuptools]
packages = ["dojo_dash"]

[tool.setuptools.dynamic]
version = { attr = "dojo_dash.__version__" }

[tool.setuptools.package-data]
dojo_dash = ["assets/*.svg"]

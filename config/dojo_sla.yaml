# Optional: per-severity SLA windows (in days) for the evidence report's SLA-compliance
# table. Overridable path via $DOJO_DASH_SLA. Delete this file and the SLA section simply
# renders "not configured" — nothing else breaks.
#
# `windows`: an open finding older than its severity's window counts as "breached".
# `enforce`: purely cosmetic — a false value tags the row "not enforced" in the report.
windows:
  critical: 7
  high: 30
  medium: 90
  low: 180
enforce:
  critical: true
  high: true
  medium: true
  low: false

# Smoke-test SLA windows. Sibling of fixtures/reports.yaml — the renderer
# resolves this relative to the config file's directory, so no CI flag is
# needed. Without it the evidence report's SLA section renders "not
# configured" and the smoke test covers less. Generic, as deleted in 97399cf.
# Optional: per-severity SLA windows (in days) for the evidence report's SLA-compliance
# table. Overridable path via $DOJO_DASH_SLA. Delete this file and the SLA section simply
# renders "not configured" — nothing else breaks.
#
# `windows`: an open finding older than its severity's window counts as "breached".
# `enforce`: purely cosmetic — a false value tags the row "not enforced" in the report.
windows:
  critical: 7
  high: 30
  medium: 90
  low: 180
enforce:
  critical: true
  high: true
  medium: true
  low: false
